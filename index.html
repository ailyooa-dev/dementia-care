    <script>
        // 核心主題資料庫
        const topics = [
            {
                id: 1,
                title: '1. 認識失智症',
                icon: '🧠',
                desc: '失智症不是正常老化，了解早期十大警訊與核心症狀。',
                content: `
                    <h3>什麼是失智症？</h3>
                    <p>失智症（Dementia）不是單一的一種疾病，而是一群症狀的組合（症候群）。它的主要特徵是大腦功能逐漸退化，導致記憶力、思考能力、語言能力、定向感與判斷力等認知功能減退，並嚴重影響到日常獨立生活能力。</p>
                    
                    <h3>失智症與正常老化的區別</h3>
                    <ul>
                        <li><strong>正常老化：</strong> 可能偶爾忘記某個人的名字，但過一陣子會想起來；做記憶測試時，經提示能想起來。</li>
                        <li><strong>失智症：</strong> 對於剛發生的事情完全忘記，無法回想；甚至會連帶忘記自己剛剛問過的問題或做過的事，經提示也無法想起。</li>
                    </ul>

                    <h3>失智症的十大早期警訊</h3>
                    <ul>
                        <li>1. 記憶力減退影響到生活（重複詢問相同問題）。</li>
                        <li>2. 計劃事情或解決問題有困難（如搞不清楚食譜或帳單步驟）。</li>
                        <li>3. 無法勝任原本熟悉的事務（如不會開微波爐或開車迷路）。</li>
                        <li>4. 對時間或地點感到混淆（搞不清年份、季節或身在何處）。</li>
                        <li>5. 理解視覺影像和空間關係有困難（不認識鏡中的自己或常絆倒）。</li>
                        <li>6. 言語表達或書寫出現困難（找不到合適的詞彙描述事物）。</li>
                        <li>7. 物件擺放錯亂且失去回溯能力（把遙控器放進冰箱）。</li>
                        <li>8. 判斷力變差或減弱（穿著不合時宜、容易上當受騙）。</li>
                        <li>9. 退出職場或社交活動（變得孤僻、不願參與以往興趣）。</li>
                        <li>10. 情緒和個性改變（變得疑心重、焦慮、憂鬱或易怒）。</li>
                    </ul>
                `
            },
            {
                id: 2,
                title: '2. 失智症類型',
                icon: '🔍',
                desc: '阿茲海默症、血管性失智症、路易氏體失智症等介紹。',
                content: `
                    <h3>失智症的主要分類與特徵</h3>
                    <p>失智症主要分為「退化性」與「血管性」兩大類，也有部分患者屬於混合型：</p>
                    
                    <h4>1. 阿茲海默症 (Alzheimer's Disease)</h4>
                    <p>最常見的退化性失智症，約佔所有失智症病例的 60% 至 70%。主要因大腦異常蛋白質（β-類澱粉蛋白與Tau蛋白質）堆積導致神經細胞死亡。早期主要表現為近期記憶衰退、時間與空間定向感喪失。</p>

                    <h4>2. 血管性失智症 (Vascular Dementia)</h4>

        // 切換並標記特定行政區的失智社區服務據點與地圖
        function filterDistrictSites(district) {
            const container = document.getElementById('district-sites-container');
            if (!container) return;

            // 更新按鈕選中狀態
            document.querySelectorAll('.district-btn').forEach(btn => {
                if (btn.getAttribute('data-district') === district) {
                    btn.className = 'district-btn bg-brand text-white border-2 border-brand font-bold p-3 rounded-xl text-center text-lg transition-all shadow-md scale-105';
                } else {
                    btn.className = 'district-btn bg-white border-2 border-slate-200 hover:border-brand hover:bg-sky-50 text-slate-800 font-bold p-3 rounded-xl text-center text-lg transition-all shadow-sm';
                }
            });

            const data = taipeiDementiaSites[district];
            if (!data) return;

            const mapQuery = encodeURIComponent(`臺北市${district} 失智社區服務據點`);
            const embedMapUrl = `https://maps.google.com/maps?q=${mapQuery}&t=&z=14&ie=UTF8&iwloc=&output=embed`;

            let extraMapBtn = '';
            if (data.customMapUrl) {
                extraMapBtn = `
                    <a href="${data.customMapUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg px-5 py-2.5 rounded-xl transition-colors shadow">
                        🗺️ 開啟${district}專屬自訂地圖 ↗
                    </a>
                `;
            }

            let sitesHtml = data.sites.map((site, idx) => {
                // 清理括號內輔助說明以利 Google Maps 精準定位地址
                const cleanAddress = site.address.replace(/\(.*?\)|（.*?）/g, '');
                const navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanAddress)}`;
                const telClean = site.phone.replace(/[^0-9]/g, '').slice(0, 10);

                return `
                    <div class="bg-white border-2 border-sky-100 hover:border-brand p-5 rounded-2xl shadow-sm transition-all flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="bg-brand text-white text-sm font-bold px-3 py-0.5 rounded-full">${district} #${idx + 1}</span>
                                <h5 class="text-xl md:text-2xl font-bold text-slate-900 m-0">${site.name}</h5>
                            </div>
                            <p class="text-lg text-slate-700 m-0">📍 <strong>地址：</strong>${site.address}</p>
                            <p class="text-lg text-slate-700 m-0">📞 <strong>電話：</strong>${site.phone}</p>
                            <p class="text-base text-slate-600 m-0">⏰ <strong>開辦時間：</strong>${site.hours}</p>
                        </div>
                        <div class="flex flex-wrap md:flex-col gap-2 shrink-0">
                            <a href="${navUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-lg px-4 py-2.5 rounded-xl shadow transition-colors">
                                🧭 地圖導航
                            </a>
                            <a href="tel:${telClean}" class="inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg px-4 py-2.5 rounded-xl shadow transition-colors">
                                📞 撥打電話
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="bg-sky-50/70 border-2 border-sky-200 rounded-3xl p-5 md:p-6 space-y-5 fade-in">
                    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-sky-200 pb-4">

                            <p class="text-base text-slate-600 m-0 mt-1">資料依據：臺北市政府衛生局《115年度臺北市失智社區服務據點通訊錄》</p>

        // 下載 PDF 功能 (使用 html2pdf.js)
        function downloadPDF(e) {
            const element = document.getElementById('printable-worksheet');
            if (!element) return;

            const select = document.getElementById('worksheet-select');
            let fileName = '健腦認知活動學習單.pdf';
            if (select) {
                const selectedText = select.options[select.selectedIndex].text;
                fileName = selectedText.replace(/^[0-9.]+\s*/, '') + '.pdf';
            }

            const btn = e ? e.currentTarget : document.getElementById('pdf-btn');
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '⏳ 正在產生 PDF 檔案...';
                btn.disabled = true;
            }

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            if (typeof html2pdf !== 'undefined') {
                html2pdf().set(opt).from(element).save().then(() => {
                    if (btn) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                }).catch(err => {
                    console.error('PDF產生錯誤:', err);
                    showModal('PDF產生提示', 'PDF產生失敗，請嘗試使用「直接列印此頁」按鈕。');
                    if (btn) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                });
            } else {
                showModal('套件載入提示', 'PDF 生成元件載入中，請稍候再試或使用「直接列印此頁」。');
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        }

        // 直接列印功能
        function printCurrentWorksheet() {
            const printContent = document.getElementById('printable-worksheet');
            if (!printContent) return;

            try {
                const printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html lang="zh-Hant-TW">
                        <head>
                            <meta charset="UTF-8">
                            <title>健腦認知活動學習單</title>
                            <script src="https://cdn.tailwindcss.com"><\/script>
                            <style>
                                body { font-family: "Noto Sans TC", sans-serif; padding: 20px; background: white; color: black; }
                                @media print { body { padding: 0; } }
                            </style>
                        </head>
                        <body>
                            <div>${printContent.innerHTML}</div>
                            <script>
                                window.onload = function() {
                                    setTimeout(function() {
                                        window.print();
                                        window.close();
                                    }, 400);
                                };
                            <\/script>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                    return;
                }
            } catch (e) {
                console.warn('開啟列印新視窗受阻，嘗試直接觸發列印:', e);
            }

            try {
                window.print();
            } catch (err) {
                console.error('列印觸發失敗:', err);
                showModal('列印提示', '如果瀏覽器阻擋了列印視窗，請改為點擊「📥 下載 PDF 檔案」按鈕進行儲存與列印。');
            }
        }

        // 自訂提示彈窗
        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
